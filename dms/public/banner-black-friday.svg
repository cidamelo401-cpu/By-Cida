<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="goldFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>

  <!-- diagonal gold accent stripes -->
  <polygon points="1060,0 1140,0 980,420 900,420" fill="#C9A84C" opacity="0.08"/>
  <polygon points="1180,0 1210,0 1050,420 1020,420" fill="#C9A84C" opacity="0.12"/>
  <rect x="0" y="0" width="1600" height="3" fill="#C9A84C"/>
  <rect x="0" y="417" width="1600" height="3" fill="#C9A84C"/>

  <!-- Left: brand + headline -->
  <g transform="translate(70,0)">
    <text x="0" y="110" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" fill="#FFFFFF" letter-spacing="2">DMS <tspan fill="#C9A84C">SPORTS</tspan></text>

    <text x="0" y="205" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" fill="#C9A84C" letter-spacing="1">BLACK</text>
    <text x="0" y="280" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" letter-spacing="1">FRIDAY</text>

    <text x="0" y="330" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#D9D9D9" letter-spacing="0.5">DESCONTO PROGRESSIVO NO VALOR DA SUA COMPRA</text>
  </g>

  <!-- Right: discount tiers -->
  <g transform="translate(900,80)">
    <!-- tier 1 -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="200" height="220" rx="14" fill="#141414" stroke="#C9A84C" stroke-width="2"/>
      <path transform="translate(78,26) scale(1.8)" d="M8 4l4 2 4-2 4 3-3 3v10H7V10L4 7l4-3z" fill="none" stroke="#C9A84C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="100" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">1 CAMISA</text>
      <text x="100" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#C9A84C">5%</text>
      <text x="100" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#D9D9D9" letter-spacing="1">DE DESCONTO</text>
    </g>
    <!-- tier 2 -->
    <g transform="translate(216,0)">
      <rect x="0" y="0" width="200" height="220" rx="14" fill="#141414" stroke="#C9A84C" stroke-width="2"/>
      <path transform="translate(68,26) scale(1.8)" d="M8 4l4 2 4-2 4 3-3 3v10H7V10L4 7l4-3z" fill="none" stroke="#C9A84C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <path transform="translate(88,26) scale(1.8)" d="M8 4l4 2 4-2 4 3-3 3v10H7V10L4 7l4-3z" fill="none" stroke="#C9A84C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="100" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">2 CAMISAS</text>
      <text x="100" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#C9A84C">10%</text>
      <text x="100" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#D9D9D9" letter-spacing="1">DE DESCONTO</text>
    </g>
    <!-- tier 3 -->
    <g transform="translate(432,0)">
      <rect x="0" y="0" width="230" height="220" rx="14" fill="#1A1507" stroke="#C9A84C" stroke-width="3"/>
      <path transform="translate(50,26) scale(1.8)" d="M8 4l4 2 4-2 4 3-3 3v10H7V10L4 7l4-3z" fill="none" stroke="#C9A84C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <path transform="translate(70,26) scale(1.8)" d="M8 4l4 2 4-2 4 3-3 3v10H7V10L4 7l4-3z" fill="none" stroke="#C9A84C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <path transform="translate(90,26) scale(1.8)" d="M8 4l4 2 4-2 4 3-3 3v10H7V10L4 7l4-3z" fill="none" stroke="#C9A84C" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      <text x="115" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#FFFFFF">3 CAMISAS</text>
      <text x="115" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#C9A84C">15%</text>
      <text x="115" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="16" fill="#D9D9D9" letter-spacing="1">DE DESCONTO</text>
    </g>
  </g>

  <!-- bottom payment strip -->
  <rect x="0" y="330" width="1600" height="90" fill="#111111"/>
  <rect x="0" y="330" width="1600" height="1" fill="#C9A84C" opacity="0.4"/>

  <g transform="translate(70,355)">
    <rect x="0" y="0" width="40" height="28" rx="5" fill="none" stroke="#C9A84C" stroke-width="2"/>
    <rect x="0" y="7" width="40" height="5" fill="#C9A84C"/>
    <text x="54" y="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#FFFFFF">PAGAMENTO NO CARTÃO</text>
    <rect x="310" y="-6" width="120" height="30" rx="15" fill="#C9A84C"/>
    <text x="370" y="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="14" fill="#0A0A0A">EM ATÉ 3X SEM JUROS</text>
  </g>

  <g transform="translate(560,355)">
    <path d="M12 0l12 12-12 12L0 12z" fill="#C9A84C"/>
    <text x="30" y="20" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="17" fill="#FFFFFF">PAGAMENTO NO PIX</text>
  </g>

  <text x="900" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9A9A9A">O desconto é aplicado somente sobre o preço</text>
  <text x="900" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9A9A9A">correspondente à forma de pagamento escolhida: <tspan font-weight="700" fill="#C9A84C">cartão ou Pix</tspan>.</text>
</svg>
