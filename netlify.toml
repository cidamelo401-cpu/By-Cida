[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/eventos/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Smart Onboarding — serve index.html for any /onboarding/[slug]
[[redirects]]
  from = "/onboarding/*"
  to = "/onboarding/index.html"
  status = 200

[[headers]]
  for = "/onboarding/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
